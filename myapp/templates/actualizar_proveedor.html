{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h3>✏️ Actualizar Proveedor</h3>

    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'proveedores_menu' %}" class="btn btn-secondary mt-3">↩️ Volver</a>
  </form>
</div>
{% endblock %}
