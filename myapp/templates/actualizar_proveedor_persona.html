{% extends "base.html" %}

{% block content %}
<h2>Actualizar Proveedor</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}
        <div class="alert alert-danger">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
    <button type="submit" class="btn btn-success">Guardar cambios</button>
    <a href="{% url 'proveedores_menu' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
