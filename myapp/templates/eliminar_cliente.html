{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>🗑️ Eliminar Cliente</h2>
    <p>¿Estás seguro de que deseas eliminar al cliente <strong>{{ cliente.nombre }} {{ cliente.primer_apellido }}</strong> (ID: {{ cliente.id_cliente }})?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'clientes_menu' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
